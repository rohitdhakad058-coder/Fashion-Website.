<!DOCTYPE html>
<html lang="en">

  <title>Cart - StyleHaven</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">

      <a class="navbar-brand" href="index.html">STYLEHAVEN</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">

          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="shop.html">Shop</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
        <div class="d-flex align-items-center gap-3">
          <a href="login.html" class="btn btn-outline-dark btn-sm" id="login-link">
            <i class="bi bi-person"></i> Login
          </a>
          <div class="d-none align-items-center gap-2" id="user-info">
            <span class="text-muted small" id="user-name"></span>
            <button class="btn btn-outline-secondary btn-sm" onclick="logout()">Logout</button>
          </div>
          <a href="cart.html" class="btn btn-dark btn-sm position-relative">
            <i class="bi bi-bag"></i>
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger cart-count"

    </div>

        <div class="col-lg-8">
          <div class="list-group shadow-sm" id="cart-items">

          </div>
        </div>

        <div class="col-lg-4" id="cart-summary">

        </div>

      </div>
    </div>

    <div id="toast" class="toast align-items-center text-white bg-dark border-0" role="alert">
      <div class="d-flex">
        <div class="toast-body" id="toast-msg"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
