<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - StyleOra</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">


  <nav class="navbar bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand" href="index.html">STYLEORA</a>
      <a href="register.html" class="btn btn-outline-dark btn-sm">Register</a>
    </div>
  </nav>



  <div class="d-flex align-items-center justify-content-center" style="min-height: 85vh;">
    <div class="col-md-5 col-lg-4 px-3">


      <div class="card border-0 shadow p-4 p-md-5">


        <h2 class="text-center mb-1">Welcome Back</h2>
        <p class="text-center text-muted small mb-4">Sign in to your StyleHaven account</p>

        <form onsubmit="handleLogin(event)">

          <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control" id="login-email"
                   placeholder="Enter your email..." required>
          </div>

          <div class="mb-4">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="login-password"
                   placeholder="Enter your email..." required>
          </div>

          <button type="submit" class="btn btn-dark w-100">
            <i class="bi bi-box-arrow-in-right me-2"></i> Sign In
          </button>

        </form>

        <hr class="my-4">

        <p class="text-center small mb-0">
          Don't have an account?
          <a href="register.html" class="text-dark fw-bold">Create one</a>
        </p>

        <div class="alert alert-light border mt-3 small text-muted text-center">
          <i class="bi bi-info-circle me-1"></i>
          Register first, then login with those credentials.
        </div>

      </div>

    </div>
  </div>


  <div class="position-fixed bottom-0 end-0 p-3" style="z-index:1100">
    <div id="toast" class="toast align-items-center text-white bg-dark border-0" role="alert">
      <div class="d-flex">
        <div class="toast-body" id="toast-msg"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
  <script>

    if (currentUser) window.location.href = "index.html";

    function handleLogin(e) {
      e.preventDefault();
      const email    = document.getElementById("login-email").value;
      const password = document.getElementById("login-password").value;

      const ok = login(email, password);

      if (ok) {
        showToast("Welcome back, " + currentUser.name + "!");
        setTimeout(() => window.location.href = "index.html", 1200);
      } else {
        showToast("Wrong email or password. Please register first.");
      }
    }
  </script>

</body>
</html>
