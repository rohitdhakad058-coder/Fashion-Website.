<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - StyleOra</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <nav class="navbar bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand" href="index.html">STYLEORA</a>
      <a href="login.html" class="btn btn-outline-dark btn-sm">Sign In</a>
    </div>
  </nav>


  <div class="d-flex align-items-center justify-content-center" style="min-height: 85vh;">
    <div class="col-md-5 col-lg-4 px-3">

      <div class="card border-0 shadow p-4 p-md-5">


        <h2 class="text-center mb-1">Create Account</h2>
        <p class="text-center text-muted small mb-4">
          Join Styleora and get <strong>15% off</strong> your first order
        </p>

        <form onsubmit="handleRegister(event)">

          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" id="reg-name"
                   placeholder="Enter your name..." required minlength="2">
          </div>

          <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control" id="reg-email"
                   placeholder="Enter your email..." required>
          </div>

          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="reg-password"
                   placeholder="Minimum 6 characters" required minlength="6">
          </div>

          <div class="mb-4">
            <label class="form-label">Confirm Password</label>
            <input type="password" class="form-control" id="reg-confirm"
                   placeholder="Repeat your password" required minlength="6">
          </div>
          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="terms" required>
            <label class="form-check-label small" for="terms">
              I agree to the <a href="#">Terms</a> &amp; <a href="#">Privacy Policy</a>
            </label>
          </div>

          <button type="submit" class="btn btn-dark w-100">
            <i class="bi bi-person-plus me-2"></i> Create Account
          </button>

        </form>

        <hr class="my-4">

        <p class="text-center small mb-0">
          Already have an account?
          <a href="login.html" class="text-dark fw-bold">Sign in</a>
        </p>

      </div>

    </div>
  </div>


  <div class="position-fixed bottom-0 end-0 p-3" style="z-index:1100">
    <div id="toast" class="toast align-items-center text-white bg-dark border-0" role="alert">
      <div class="d-flex">
        <div class="toast-body" id="toast-msg"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
  <script>
    if (currentUser) window.location.href = "index.html";

    function handleRegister(e) {
      e.preventDefault();
      const name     = document.getElementById("reg-name").value;
      const email    = document.getElementById("reg-email").value;
      const password = document.getElementById("reg-password").value;
      const confirm  = document.getElementById("reg-confirm").value;

    
      if (password !== confirm) {
        showToast("Passwords do not match!");
        return;
      }

      const ok = register(name, email, password);

      if (ok) {
        
        login(email, password);
        showToast("Account created! Welcome, " + name + "!");
        setTimeout(() => window.location.href = "index.html", 1200);
      } else {
        showToast("Email already in use. Please login instead.");
      }
    }
  </script>

</body>
</html>
