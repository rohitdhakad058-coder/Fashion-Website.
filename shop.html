<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop - StyleOra</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>


  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">STYLEORA</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav mx-auto gap-2">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="shop.html">Shop</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
        <div class="d-flex align-items-center gap-3">
          <a href="login.html" class="btn btn-outline-dark btn-sm" id="login-link">
            <i class="bi bi-person"></i> Login
          </a>
          <div class="d-none align-items-center gap-2" id="user-info">
            <span class="text-muted small" id="user-name"></span>
            <button class="btn btn-outline-secondary btn-sm" onclick="logout()">Logout</button>
          </div>
          <a href="cart.html" class="btn btn-dark btn-sm position-relative">
            <i class="bi bi-bag"></i>
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger cart-count"
                  id="cart-badge">0</span>
          </a>
        </div>
      </div>
    </div>
  </nav>


  <div class="page-header">
    <h2>All Products</h2>
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb justify-content-center mb-0">
        <li class="breadcrumb-item"><a href="index.html">Home</a></li>
        <li class="breadcrumb-item active">Shop</li>
      </ol>
    </nav>
  </div>


 
  <section class="section">
    <div class="container">
      <div class="row g-4">

        
        <div class="col-lg-3">
          <div class="card border-0 shadow-sm p-3">

            <h6 class="text-uppercase fw-bold mb-3" style="letter-spacing:1px">Filters</h6>

          
            <input type="text" class="form-control mb-3" id="filter-search"
                   placeholder="Search products..." oninput="filterProducts()">

            
            <label class="form-label small fw-bold text-muted text-uppercase">Category</label>
            <select class="form-select mb-3" id="filter-category" onchange="filterProducts()">
              <option value="">All Categories</option>
              <option value="Women">Women</option>
              <option value="Men">Men</option>
              <option value="Accessories">Accessories</option>
            </select>

            
            <label class="form-label small fw-bold text-muted text-uppercase">
              Max Price: <span id="price-display">&#8377 10000</span>
            </label>
            <input type="range" class="form-range mb-3" id="filter-price"
                   min="2000" max="7000" step="10" value="7000"
                   oninput="document.getElementById('price-display').textContent='&#8377'+this.value; filterProducts()">

            
            <label class="form-label small fw-bold text-muted text-uppercase">Sort By</label>
            <select class="form-select mb-3" id="filter-sort" onchange="filterProducts()">
              <option value="">Default</option>
              <option value="low">Price: Low to High</option>
              <option value="high">Price: High to Low</option>
              <option value="rating">Top Rated</option>
            </select>

           
            <button class="btn btn-outline-secondary w-100 btn-sm" onclick="resetFilters()">
              <i class="bi bi-arrow-counterclockwise me-1"></i> Reset Filters
            </button>

          </div>
        </div>


       
        <div class="col-lg-9">

          
          <div class="d-flex justify-content-between align-items-center mb-3">
            <p class="text-muted small mb-0" id="result-count">Loading...</p>
          </div>

          
          <div class="row row-cols-1 row-cols-md-3 g-4" id="product-grid">
          
          </div>

        </div>

      </div>
    </div>
  </section>


  <footer class="py-4">
    <div class="container text-center">
      <p class="text-white-50 small mb-0">&copy; 2025 StyleOra. All rights reserved.</p>
    </div>
  </footer>


  <div class="position-fixed bottom-0 end-0 p-3" style="z-index:1100">
    <div id="toast" class="toast align-items-center text-white bg-dark border-0" role="alert">
      <div class="d-flex">
        <div class="toast-body" id="toast-msg">Item added to cart!</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
  <script>
    
    const params = new URLSearchParams(window.location.search);
    const catParam = params.get("cat");

    if (catParam) {
      document.getElementById("filter-category").value = catParam;
    }

  
    filterProducts();

    function resetFilters() {
      document.getElementById("filter-search").value = "";
      document.getElementById("filter-category").value = "";
      document.getElementById("filter-price").value = 500;
      document.getElementById("filter-sort").value = "";
      document.getElementById("price-display").textContent = "500";
      filterProducts();
    }
  </script>

</body>
</html>
